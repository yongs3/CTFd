services:
  ctfd:
    build:
      context: .
      network: host
    user: root
    restart: always
    ports:
      - "8000:8000"
    environment:
      - UPLOAD_FOLDER=/var/uploads
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
      - REDIS_URL=redis://cache:6379
      - WORKERS=1
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
      - REVERSE_PROXY=true
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
      - .:/opt/CTFd:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      permissions:
        condition: service_completed_successfully
      db:
        condition: service_started
      cache:
        condition: service_started
      frpc:
        condition: service_started
    networks:
      default:
      internal:

  # TODO: CTFd 4.0 Migrate to named volumes. Users will likely need to manually migrate existing files
  permissions:
    image: alpine:3.23
    user: root
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
    command: chown -R 1001:1001 /var/uploads /var/log/CTFd

  nginx:
    image: nginx:stable
    restart: always
    volumes:
      - ./conf/nginx/http.conf:/etc/nginx/nginx.conf.template:ro
    environment:
      - LLM_PROXY_UPSTREAM=${LLM_PROXY_UPSTREAM:-localhost}
    command:
      - /bin/sh
      - -c
      - sed "s/__LLM_UPSTREAM__/$$LLM_PROXY_UPSTREAM/g" /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g "daemon off;"
    ports:
      - 80:80
      - 8888:8888
    depends_on:
      - ctfd
    networks:
      default:
      containers:

  db:
    image: mariadb:10.11
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=ctfd
      - MARIADB_USER=ctfd
      - MARIADB_PASSWORD=ctfd
      - MARIADB_DATABASE=ctfd
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - .data/mysql:/var/lib/mysql
    networks:
      internal:
    # This command is required to set important mariadb defaults
    command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --wait_timeout=28800, --log-warnings=0]

  cache:
    image: redis:4
    restart: always
    volumes:
      - .data/redis:/data
    networks:
      internal:

  frpc:
    image: frankli0324/frp:frpc
    restart: always
    command: [
      "--server_addr=frps",
      "--server_port=7000",
      "--token=${FRP_TOKEN:-changeme}",
      "--admin_addr=0.0.0.0",
      "--admin_port=7400",
    ]
    depends_on:
      - frps
    networks:
      frp:
      internal:
      containers:

  frps:
    image: frankli0324/frp:frps
    restart: always
    command: [
      "--bind_addr=0.0.0.0",
      "--bind_port=7000",
      "--token=${FRP_TOKEN:-changeme}",
      "--subdomain_host=${FRP_SUBDOMAIN_HOST:-127.0.0.1.nip.io}",
      "--vhost_http_port=8080",
    ]
    ports:
      - 8080:8080
      - 10000-10100:10000-10100
    networks:
      frp:
      default:

networks:
  default:
  internal:
    internal: true
  frp:
    internal: true
  containers:
    internal: true
    driver: overlay
    attachable: true
